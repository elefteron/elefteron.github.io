<script>load+='hdr '
  tfu=[0,0,0] // total,free,used
  tfu_sum=[0,0,0]
  Drives=0
function load_fs(){      z='&nbsp;'; z2=z+z // to avoid cell wrap on table resize
//   -- DriveList header order
     if (vollng<17)vollng=17 // max:32
     zp='';   for (i=(vollng-11);i<vollng; i=i+2) zp+=z// 2chars unbreaked space
     val[1]="no"                 ;  bg[1]=bg3;  fg[1]=fg3;  aln[1]='';       // 1 drv_no
     val[2]="Free"+z2+"Mb"       ;  bg[2]=bg3;  fg[2]=fg3;  aln[2]='right';  // 2 free
     val[3]="Max"+z2+"Mb"        ;  bg[3]=bg3;  fg[3]=fg3;  aln[3]='right';  // 3 max
     val[4]="Used"+z2+"Mb"       ;  bg[4]=bg3;  fg[4]=fg3;  aln[4]='right';  // 4 used
     val[5]="Volume"+z2+"Name"+zp;  bg[5]=bg3;  fg[5]=fg3;  aln[5]='left' ;  // 5 vol_n
     val[6]="Volume"+z2+"ID"     ;  bg[6]=bg3;  fg[6]=fg3;  aln[6]='left' ;  // 6 vol_id
     val[7]="File"+z+"Sys"       ;  bg[7]=bg3;  fg[7]=fg3;  aln[7]='';       // 7 f_sys
     val[8]=' '+ "Drv_Type"      ;  bg[8]=bg3;  fg[8]=fg3;  aln[8]='center'; // 8 drv_type
     hdr=OrdRowFmt(order_hdr)
//  ----------------------------------------
    Drives=0
    if(browserID()=='IE'){ 
      Drives   =DrivesReady()
      ShowDriveList() // ->addDrv()->DriveList
    }
//  --
    freeb=b2mb(tfu_sum[0]).toString()
    maxb =b2mb(tfu_sum[1]).toString()
    usedb=b2mb(tfu_sum[2]).toString()
    zp='&nbsp;';
    freeb_=groupCharsBy(freeb,3,3,zp)
     maxb_=groupCharsBy( maxb,3,3,zp)
    usedb_=groupCharsBy(usedb,3,3,zp)
//  -- DriveList body order
    val[1]=Drives; bg[1]=bg3;  fg[1]=fg3;  aln[1]='right'; // 1 drvn   : E:
    val[2]=freeb_; bg[2]=bg3;  fg[2]=fg3;  aln[2]='right'; // 2 free   : 87.77
    val[3]=maxb_ ; bg[3]=bg3;  fg[3]=fg3;  aln[3]='right'; // 3 max    : 4 102.50
    val[4]=usedb_; bg[4]=bg3;  fg[4]=fg3;  aln[4]='right'; // 4 used   : 4 014.73
    val[5]=' ';    bg[5]=bg3;  fg[5]=fg3;  aln[5]='';      // 5 voln   : [
    val[6]=' ';    bg[6]=bg3;  fg[6]=fg3;  aln[6]='';      // 6 voli   : 1029-CB0D
    val[7]=' ';    bg[7]=bg3;  fg[7]=fg3;  aln[7]='';      // 7 fsys   : (NTFS)
    val[8]=' ';    bg[8]=bg3;  fg[8]=fg3;  aln[8]='';      // 8 drvt   : Fixed
    ftr=OrdRowFmt(order_hdr)
//   -- calculate chars by order_body
    chars=0; vollng=17
    for (var i=0; i<=order_body.length-1; i++) {j=order_body[i]
      if (j==0 | j==1) chars+=2            // 1 drv_no "E:"
      else if (j==2)   chars+=freeb.length // 2 free
      else if (j==3)   chars+= maxb.length // 3 max
      else if (j==4)   chars+=usedb.length // 4 used
      else if (j==5)   chars+=vollng       // 5 vol_n
      else if (j==6)   chars+=9            // 6 vol_id
      else if (j==7)   chars+=7            // 7 f_sys
      else if (j==8)   chars+=10           // 8 drv_type
    }
// ---
    h1=winh(); w1=winw();
    setw(w1,h1,'B','R')/*-- window resize & move -- */
    tstr+=' chars:'+chars  +' chW:'+chW  +' w:'+w1+' tblW:' +tblW +'<br>'
         +' drvs :'+Drives +' chH:'+chH  +' h:'+h1+'<br>'
         +' scrbar:'+scrollbar +' scrSz:'+scrollbarSz
      // +' vol:'  +vollng + ' cols:'+order_body.length
      // +' max :' + maxb.toString().length
      // +' free:' +freeb.toString().length
      // +' used:' +usedb.toString().length
//  ---
    tbl='<table border="0" cellspacing="1" cellpading="2"'+par('bg','dimgray')+'>'
    out(tbl+'<tr>'+hdr+'</tr>'+DriveList+'<tr>'+ftr+'</tr>'+'</table>'+eol)
    function a2(a,b){return '<a title="'+b+'">'+a+'</a>'}
    out('<table>'+'<tr>' // <xmp>
     // tb_col(bg  ,fg ,tx          ,al)
       +tb_col(bg0 ,fg0,a2(getdate2()  ,'y-m-d'   ),'left')
       +tb_col(bg0 ,fg0,a2(gettime2(t_),'h:m:s'   ),'left')
       +tb_col(bg2b,fg0,a2(UserName    ,'user'    ),'left')
       +tb_col(bg0 ,fg0,a2(ComputerName,'computer'),'left')
       +tb_col(bg2b,fg0,a2(sys()       ,'OS'      ),'left')
       +tb_col(bg0 ,fg0,a2(root        ,'root'    ),'left')
       +'</tr><tr>'
    // +tb_col(bg3 ,fg3,'y-m-d'     ,'left')
    // +tb_col(bg3 ,fg3,'h:m:s'     ,'left')
    // +tb_col(bg3 ,fg3,'user'      ,'left')
    // +tb_col(bg3 ,fg3,'computer'  ,'left')
    // +tb_col(bg3 ,fg3,'OS'        ,'left')
    // +tb_col(bg3 ,fg3,'root'      ,'left')
    // // 0=WindowsFolder 1=SystemFolder 2=TemporaryFolder
    // +'</tr>'
       +'</table>'+eol)
}// ----------------------------------
</script>
